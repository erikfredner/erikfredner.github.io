  <!-- An asterisk on a transparent ground, set in the site's own EB Garamond
       at weight 600, the same weight as the headings and the wordmark.

       The outline is baked into a path rather than set as a text element: a
       favicon renders outside the page's font context, so text would fall back
       to whatever serif the viewer's system happens to have, and the asterisk
       is a glyph whose shape varies a lot between faces. Extracted from
       fonts/eb-garamond-roman.woff2 with fontTools (instancer to pin the
       weight axis, then SVGPathPen), scaled so its larger dimension fills 28
       of the 32 units and centred; the negative y scale converts the font's
       y-up coordinates to SVG's y-down. Regenerate it the same way rather than
       hand-editing the path data.

       The fill follows the browser's theme so the mark stays legible against
       both a light and a dark tab strip. The two colours are the site's own
       text tokens from css/style.css. -->
  <style>
    path { fill: #1a1a1a }
    @media (prefers-color-scheme: dark) { path { fill: #e4e2dd } }
  </style>
