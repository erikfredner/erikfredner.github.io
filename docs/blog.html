<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Blog&mdash;Erik Fredner">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Erik Fredner">
      <meta name="color-scheme" content="light dark">
  <!-- Preload the three faces that set running prose: the serif roman, its
       italic, and the sans behind the nav and h1. The italic belongs here even
       though it covers less text — style.css uses `font-display: optional`, and
       under `optional` each face that misses its block period is dropped for
       the whole pageview on its own. Leaving the italic to normal CSS discovery
       let the roman win and the italic lose, so a sentence with a book title in
       it rendered half in Source Serif and half in Georgia. Mono stays
       undeclared: it is inline-only and appears on few pages.
       `crossorigin` is required even same-origin — fonts are fetched in CORS
       mode, and omitting it makes the preload a separate cache entry, i.e. a
       silent double download. -->
  <link rel="preload" href="fonts/source-serif-4-roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-serif-4-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-sans-3-upright.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" href="/feed.xml" title="Erik Fredner">
    <title>Blog&mdash;Erik Fredner</title>
  <!-- Goat Counter -->
  <script data-goatcounter="https://erik.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="top"></div>
  <header>
    <!-- aria-current marks the section you are in. The nav-* variables are set
         by the Makefile from each source file's stem, so a page whose stem
         matches no nav item simply sets one that nobody reads. (Note for
         editors: a literal dollar sign is template syntax even inside an HTML
         comment, so the Makefile's metadata flag cannot be quoted here.) -->
    <nav aria-label="Site navigation">
      <ul>
        <li><a href="index.html" class="site-title">Erik Fredner</a></li>
      </ul>
      <button type="button" class="nav-toggle" aria-label="Toggle navigation" aria-controls="nav-links"
        aria-expanded="false">&#9776;</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="blog.html" aria-current="page">Blog</a></li>
        <li><a href="cv.html">CV</a></li>
        <li><a href="research.html">Research</a></li>
      </ul>
    </nav>
  </header>
  <!-- tabindex="-1" so the skip link actually moves focus here. Without it the
       page scrolls to <main> but focus stays on the link, and the next Tab
       resumes from the top of the nav rather than from the content. -->
  <main id="main-content" tabindex="-1">
    <article>
            <header>
        <h1 class="title">Blog</h1>
        
        
      </header>
                  <div class="post-card">
                  <p class="post-date">
                  2026-06-19
                  </p>
                  <h2 id="symposium-mapping-the-canon"><a
                  href="blog/darmstadt.html">Symposium: Mapping the
                  Canon</a></h2>
                  <p>Presenting new research on canons within
                  canons.</p>
                  </div>
                  <div class="post-card">
                  <p class="post-date">
                  2026-04-06
                  </p>
                  <h2 id="memorize-poems-with-anki"><a
                  href="blog/anki-cloze.html">Memorize poems with
                  Anki</a></h2>
                  <p>A tool to automatically create cloze tests for
                  memorizing poems.</p>
                  </div>
                  <p class="feed-link">
                  <a href="feed.xml">Subscribe via Atom</a>
                  </p>
    </article>
    <a href="#top" class="back-to-top" aria-label="Back to top">&uarr;</a>

    <script>
      // Mobile nav toggle
      (function () {
        var toggle = document.querySelector('.nav-toggle');
        var nav = toggle && toggle.closest('nav');
        if (!toggle || !nav) return;
        // Only now, with the button known to be wired up, does the stylesheet
        // get permission to collapse the links behind it. See the `js-nav`
        // rules in style.css.
        nav.classList.add('js-nav');
        toggle.addEventListener('click', function () {
          var open = nav.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
        });
      })();

      // Show when #top leaves viewport; hide when visible again.
      (function () {
        var btn = document.querySelector('.back-to-top');
        var top = document.querySelector('#top');
        if (!btn || !top) return;

        function show() { btn.classList.add('is-visible'); }
        function hide() { btn.classList.remove('is-visible'); }

        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries) {
            entries[0].isIntersecting ? hide() : show();
          }).observe(top);
        } else {
          window.addEventListener('scroll', function () {
            (window.scrollY || document.documentElement.scrollTop) > 400 ? show() : hide();
          }, { passive: true });
        }
      })();
    </script>
  </main>
</body>

</html>
